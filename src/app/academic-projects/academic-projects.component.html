<div class="section-wrap section-block">
  <div class="section-heading compact-heading">
    <p class="eyebrow">Academic projects</p>
    <h2>Applied computer vision, clustering, and real-time ML systems.</h2>
  </div>

  <div class="projects-grid">
    <article class="award-card project-card" *ngFor="let project of projects">
      <h3>{{ project.name }}</h3>
      <ul class="experience-bullets">
        <li *ngFor="let bullet of project.bullets">
          <strong>{{ bullet.title }}:</strong>
          {{ bullet.text }}
        </li>
      </ul>
      <details class="environment">
        <summary>Technology environment</summary>
        <p>{{ project.environment }}</p>
      </details>
    </article>
  </div>
</div>
